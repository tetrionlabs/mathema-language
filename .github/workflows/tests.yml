name: tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # until mathema 0.7.0 is on PyPI: core from its integration branch,
      # then this package without dependency resolution
      - run: pip install "mathema @ git+https://github.com/tetrionlabs/mathema@develop"
      - run: pip install --no-deps . && pip install pytest ruff mypy
      - name: licence headers
        run: |
          status=0
          for f in $(git ls-files '*.py'); do
            if [ "$(sed -n 1p "$f")" != "# SPDX-License-Identifier: Apache-2.0" ] ||
               [ "$(sed -n 2p "$f")" != "# Copyright 2026 Tetrion Ltd" ]; then
              echo "$f: missing licence header lines"; status=1
            fi
          done
          exit $status
      - run: ruff check .
      - run: mypy src
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mathema @ git+https://github.com/tetrionlabs/mathema@develop"
      - run: pip install --no-deps . && pip install pytest pydantic jsonschema
      - run: pytest -v
